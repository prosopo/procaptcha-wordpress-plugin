name: Install E2E Packages
description: "Install the end-to-end test packages"

runs:
  using: "composite"
  steps:
    # we need to install PHP 7.4 separately from php 8.2 in the initial-setup,
    # cause WordPress is compatible with PHP 7.4
    - name: Install PHP 7.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: mbstring, mysqli, opcache

    - name: Install Nginx
      run: sudo apt-get update && sudo apt-get install -y nginx
      shell: bash

    - name: Install MySQL client
      run: sudo apt-get update && sudo apt-get install -y mysql-client
      shell: bash

    # cypress dependencies https://docs.cypress.io/guides/getting-started/installing-cypress#Linux-Prerequisites
    - name: Install cypress dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
      shell: bash

    # Pinned: Chrome 158 rejects the "*" origin Cypress 13 uses to reset storage between specs ("* is not a valid URL").
    - name: Install Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 157
        install-dependencies: true

    # Cypress looks for google-chrome and google-chrome-stable on the PATH; the runner image ships a newer Chrome under both.
    - name: Use the pinned Chrome
      run: |
        sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome
        sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome-stable
        google-chrome --version
      shell: bash

    # used in the tasks/install-wordpress-with-plugins.yml
    - name: Install JSON parser
      run: sudo apt-get update && sudo apt-get install -y jq
      shell: bash

    # used in the /tests.yml
    - name: Install wait-on
      run: npm install -g wait-on
      shell: bash
